# Builds the installable Decky ZIP on every push to main and publishes it as a
# GitHub release named after package.json's version (Releases page). Download
# the ZIP from there: the Actions "Artifacts" download wraps it in another ZIP,
# which Decky can't install.
name: Build plugin ZIP

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: Pixel-Faceplate
          path: out/*.zip
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pixel Faceplate ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Install with Decky > Settings > Developer > Install Plugin from ZIP File, using the Pixel-Faceplate-v*.zip below as it is (don't unzip it).
          files: out/*.zip
          overwrite_files: true
